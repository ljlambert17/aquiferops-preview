<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquiferOps — Coming soon</title>
<meta name="description" content="One platform for groundwater consulting — field data, lab results, analysis, and reporting in the same place. Coming soon.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Sora", "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #eaf6ff 0%, #f6fbff 55%, #eaf6ff 100%);
    color: #0f2e46;
    overflow-x: hidden;
  }

  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.25rem 0;
  }

  /* ---- Science collage (the tease) ---- */
  .collage { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
  .collage .shot {
    position: absolute;
    background: #ffffff;
    padding: 10px;
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(7, 89, 133, 0.16);
    width: 30vw; min-width: 300px; max-width: 460px;
  }
  .collage .shot img { display: block; width: 100%; height: auto; border-radius: 8px; }
  .shot.piper     { top: -4%;  left: -3%;  transform: rotate(-5.5deg); }
  .shot.schoeller { top: -6%;  right: -4%; transform: rotate(4.5deg); }
  .shot.stiff     { bottom: 16%; left: -4%; transform: rotate(3.5deg); }
  .shot.durov     { bottom: 12%; right: -3%; transform: rotate(-4deg); }

  /* The white gloss: one clean veil over the whole collage, heavier toward the
     center column so the shapes tease at the edges and the message owns the middle. */
  .gloss {
    position: absolute; inset: 0; z-index: 2;
    backdrop-filter: blur(7px) saturate(1.05);
    -webkit-backdrop-filter: blur(7px) saturate(1.05);
    background: linear-gradient(90deg,
      rgba(255,255,255,0.34) 0%,
      rgba(255,255,255,0.66) 32%,
      rgba(255,255,255,0.74) 50%,
      rgba(255,255,255,0.66) 68%,
      rgba(255,255,255,0.34) 100%);
  }

  /* ---- Center message ---- */
  .message {
    position: relative; z-index: 3;
    text-align: center;
    max-width: 46rem;
    margin-bottom: clamp(200px, 26vw, 320px); /* clears the water */
  }
  /* Official logo artwork (fixed asset), CSS-cropped to the lockup region
     of the 1200x1200 master — the mark is never re-typeset in live text. */
  .logo-crop {
    position: relative;
    width: min(430px, 80vw);
    aspect-ratio: 1075 / 270;
    overflow: hidden;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 12px 34px rgba(7, 89, 133, 0.14);
  }
  .logo-crop img {
    position: absolute;
    width: calc(100% * 1200 / 1075);
    left: calc(-100% * 25 / 1075);
    top: calc(-100% * 30 / 270);
    height: auto;
  }
  .kicker {
    display: inline-block;
    margin-top: 2.1rem;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #075985;
    background: #ffffff;
    border: 1.5px solid #7dd3fc;
    border-radius: 999px;
    padding: 0.55rem 1.4rem 0.5rem;
    white-space: nowrap;
  }
  h1 {
    margin-top: 1.5rem;
    font-size: clamp(2.1rem, 5.4vw, 3.6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.08;
    color: #075985;
  }
  h1 .nowrap { white-space: nowrap; }
  .sub {
    margin: 1.15rem auto 0;
    max-width: 34rem;
    font-size: clamp(1.02rem, 2vw, 1.18rem);
    line-height: 1.55;
    color: #1e3a52;
  }
  .sub b { color: #075985; }
  .domain {
    margin-top: 1.6rem;
    font-weight: 700;
    font-size: 1.02rem;
    color: #0284c7;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  /* ---- Mountains + animated water (from the AquiferOps site) ---- */
  .waterline { position: absolute; inset: auto 0 0 0; z-index: 4; pointer-events: none; }
  .waterline svg { display: block; width: 100%; height: clamp(190px, 26vw, 330px); }
  @keyframes drift-left  { from { transform: translateX(0); }       to { transform: translateX(-1440px); } }
  @keyframes drift-right { from { transform: translateX(-1440px); } to { transform: translateX(0); } }
  .wave-a { animation: drift-left 7s linear infinite; }
  .wave-b { animation: drift-right 11s linear infinite; }
  .wave-c { animation: drift-left 17s linear infinite; }
  @keyframes wave-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
  .wave-bob { animation: wave-bob 3.5s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .wave-a, .wave-b, .wave-c, .wave-bob { animation: none; }
  }

  .footer {
    position: absolute; z-index: 5;
    left: 0; right: 0; bottom: 1.1rem;
    text-align: center;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #bae6fd;
    white-space: nowrap;
  }

  /* ---- Small screens: two shots, calmer angles ---- */
  @media (max-width: 760px) {
    .shot.stiff, .shot.durov { display: none; }
    .shot.piper     { top: -2%; left: -14%;  width: 62vw; }
    .shot.schoeller { top: 4%;  right: -16%; width: 66vw; }
    .message { margin-bottom: 230px; }
  }
</style>
</head>
